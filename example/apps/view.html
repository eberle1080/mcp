<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather</title>
<style>
  body { margin: 0; padding: 12px; font-family: var(--font-sans, system-ui, sans-serif);
         color: var(--color-text-primary, #171717); background: var(--color-background-primary, #ffffff); }
  #temperature { font-size: 2rem; }
  button { margin-top: 8px; }
</style>
</head>
<body>
<div id="city">Waiting for the forecast…</div>
<div id="temperature"></div>
<div id="conditions"></div>
<button id="refresh" disabled>Refresh</button>
<script>
// The view speaks MCP JSON-RPC to its host over postMessage (SEP-1865). It
// makes no network requests of its own, so it needs no CSP origins.
let nextId = 1;
const pending = new Map();
function request(method, params) {
  const id = nextId++;
  window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
function notify(method, params) {
  window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
}

let city = "";
function show(result) {
  const weather = result && result.structuredContent;
  if (!weather) return;
  city = weather.city;
  document.getElementById("city").textContent = weather.city;
  document.getElementById("temperature").textContent = weather.temperature + "°F";
  document.getElementById("conditions").textContent = weather.conditions;
  document.getElementById("refresh").disabled = false;
}

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return; // only the host speaks to the view
  const message = event.data || {};
  if (message.id !== undefined && pending.has(message.id)) {
    const { resolve, reject } = pending.get(message.id);
    pending.delete(message.id);
    message.error ? reject(message.error) : resolve(message.result);
    return;
  }
  // The host sends the tool's result once the view is initialized.
  if (message.method === "ui/notifications/tool-result") show(message.params);
});

// refresh_weather is visible to views only: the model never sees it.
document.getElementById("refresh").addEventListener("click", async () => {
  show(await request("tools/call", { name: "refresh_weather", arguments: { city } }));
});

(async () => {
  await request("ui/initialize", {
    appCapabilities: {},
    clientInfo: { name: "weather-view", version: "1.0.0" },
    protocolVersion: "2026-01-26",
  });
  notify("ui/notifications/initialized", {});
})();
</script>
</body>
</html>
